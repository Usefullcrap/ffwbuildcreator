  /* ============================================================
     DESIGN SYSTEM — Dusty frontier telegraph-office aesthetic
     Dark sepia background, aged-paper panels, copper/amber accents
  ============================================================ */
  :root {
    --bg:          #0f0d0a;
    --surface:     #1a1710;
    --panel:       #211e16;
    --panel-hi:    #2c2820;
    --border:      #3d3628;
    --border-hi:   #5a4f38;
    --copper:      #c8833a;
    --copper-dim:  #8a5a24;
    --amber:       #e8b84b;
    --amber-dim:   #a07c28;
    --text:        #d2cbb8;
    --text-dim:    #8e8570;
    --font-serif:  'Playfair Display', Georgia, serif;
    --font-mono:   'IBM Plex Mono', monospace;
    --font-sans:   'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding: 24px;
    font-size: 14px;
  }

  header {
    max-width: 1300px;
    margin: 0 auto 30px auto;
    border-bottom: 2px double var(--border-hi);
    padding-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  header h1 {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 2.5rem;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  header p {
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .top-actions {
    display: flex;
    gap: 12px;
  }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border-hi);
    color: var(--amber);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 8px 16px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--copper-dim);
    color: #fff;
    border-color: var(--copper);
  }
  .btn-accent {
    background: var(--copper-dim);
    color: #fff;
    border-color: var(--copper);
  }
  .btn-accent:hover {
    background: var(--copper);
  }

  .main-layout {
    max-width: 1300px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    align-items: start;
  }

  .planner-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
    position: relative;
  }
  .panel-title {
    font-family: var(--font-serif);
    font-size: 1.25rem;
    color: var(--amber);
    border-bottom: 1px solid var(--border-hi);
    padding-bottom: 6px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Form Elements */
  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
